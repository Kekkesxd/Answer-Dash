<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Dash</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main id = "app">

        <!-- Start Screen -->
         <section id="startScreen">
            <div id="menuBox">
                <h1>ANSWER DASH</h1>
                <input id="playerName" type="text" placeholder="Enter Your Name" maxlength="16"/>
                <select id="difficulty">
                     <option value="">Select difficulty</option>
                     <option value="easy">Easy</option>
                     <option value="medium">Medium</option>
                     <option value="hard">Hard</option>
                </select>
                <button id="startButton">START</button>
            </div>
         </section>

        <!-- RULES POPUP -->
        <div id="rulesPopup" class="hidden">
            <div id="rulesBox">
                <h2>HOW TO PLAY</h2>
                <p>Move with <span class="key">WASD</span> or <span class="key">ARROW KEYS</span></p>
                <p>Read the question and run to the correct answer zone</p>
                <p>Watch out for obstacles blocking your path</p>
                <p>Don't run out of time or lives!</p>
                <button id="rulesButton">LET'S GO</button>
            </div>
        </div>

        <!-- Game Screen-->
        <section id = "gameScreen" class="hidden">
            <div id="hud">
                <span id="scoreDisplay">SCORE: 0</span>
                <span id="questionsDisplay">Q: 1/10</span>
                <span id="timerDisplay">TIME: 10</span>
                <span id="livesDisplay">LIVES: 3</span>
            </div>
            <canvas id="gameCanvas" width="1500" height="600"></canvas> 
        </section> 


        <!-- END Screen-->
        <section id="endScreen" class="hidden">
            <div id="menuBox">
                <h1>GAME OVER</h1>
                <p id="finalText">You scored 0 points.</p>
                <button id="restartButton">PLAY AGAIN</button>
            </div>
        </section>
    </main>

   
    <script src="game.js"></script>
</body>
</html>
